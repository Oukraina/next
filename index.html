  <!-- Open Graph -->

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Oukraina">
      <img src="/assets/logo.svg" alt="" width="28" height="28">
      <span>Oukraina</span>
    </a>
    <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <span class="theme-toggle__icon" aria-hidden="true">◐</span>
    </button>
  </header>

  <main class="hero">
    <div class="hero__mark" aria-hidden="true">
      <img src="/assets/logo.svg" alt="">
    </div>
    <h1>Oukraina</h1>
    <p class="hero__statement">Art of the states technology</p>
  </main>

  <footer class="site-footer">
    <nav class="footer-social" aria-label="Social links">
      <a href="https://x.com/OukrainaHQ" aria-label="Oukraina on X">X</a>
      <a href="https://github.com/Oukraina" aria-label="Oukraina on GitHub">GitHub</a>
      <a href="https://www.instagram.com/OukrainaHQ" aria-label="Oukraina on Instagram">Instagram</a>
    </nav>
    <div class="footer-signature">
      <div>© <span class="footer-pirate">a pirate</span><span class="footer-island">iland</span> since et list 1187</div>
      <div class="footer-earth">with ❤️ to earth</div>
      <div class="footer-world">Vi world <span class="footer-mark" aria-hidden="true">O</span></div>
    </div>
  </footer>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
